version: '3.8'

services:
  prompt-distiller:
    build: .
    container_name: prompt-distiller
    ports:
      - "8008:8008"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
